}

.length}</b></div><div class="info-row"><span>Точек на карте</span><b>${count}</b></div><div class="info-row"><span>Заметок</span><b>${state.notes.length}</b></div><div class="info-row"><span>Общий бюджет</span><b>${money(state.routes.reduce((s,r)=>s+routeBudget(r),0))}</b></div></div></section><section class="panel subpanel"><div class="panel-top"><h3>Мои данные</h3>${icon('export',19)}</div><p class="muted" style="font-size:11px">Маршруты и заметки сохраняются в localStorage вашего браузера, без аккаунта и сервера.</p><div class="data-actions"><button class="btn btn-ghost btn-sm" data-action="export">${icon('export')} Скачать резервную копию JSON</button><button class="btn btn-outline btn-sm" data-action="import">${icon('import')} Загрузить JSON</button><button class="btn btn-danger btn-sm" data-action="reset-demo">${icon('refresh')} Восстановить примеры</button></div><div class="notice" style="margin-top:14px">Если очистить данные браузера, сохранённые маршруты исчезнут. Используйте экспорт, чтобы не потерять их.</div></section></div></div>`}
function modal(title,subtitle,content){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-backdrop><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="modal-close" data-action="close-modal" title="Закрыть">${icon('close',19)}</button></div><div class="modal-content">${content}</div></div></div>`;setTimeout(()=>document.querySelector('.modal input:not([type=hidden]),.modal textarea')?.focus(),30)}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function routeModal(id){const r=routeById(id),editing=!!r;const v=r||{title:'',city:'',country:'',startDate:'',endDate:'',description:'',cover:'mountain'};const themes=[['mountain','Горы'],['sea','Море'],['city','Город'],['petersburg','Север'],['rome','Солнце'],['istanbul','Восток']];modal(editing?'Изменить маршрут':'Новый маршрут','Расскажите, куда и когда вы хотите отправиться.',`<form data-form="route"><input type="hidden" name="id" value="${esc(r?.id||'')}"><div class="field"><label class="field-label">Название маршрута *</label><input class="input" name="title" placeholder="Например, Выходные в Казани" value="${esc(v.title)}" required maxlength="160"></div><div class="form-grid"><div class="field"><label class="field-label">Город / направление *</label><input class="input" name="city" placeholder="Казань" value="${esc(v.city)}" required maxlength="120"></div><div class="field"><label class="field-label">Страна</label><input class="input" name="country" placeholder="Россия" value="${esc(v.country)}" maxlength="120"></div><div class="field"><label class="field-label">Начало поездки</label><input class="input" name="startDate" type="date" value="${esc(v.startDate)}"></div><div class="field"><label class="field-label">Конец поездки</label><input class="input" name="endDate" type="date" value="${esc(v.endDate)}"></div><div class="field span-2"><label class="field-label">Описание</label><textarea class="textarea" name="description" rows="3" placeholder="Что хочется увидеть и сделать?">${esc(v.description)}</textarea></div><div class="field span-2"><label class="field-label">Стиль обложки</label><select class="input" name="cover">${themes.map(([key,label])=>`<option value="${key}" ${v.cover===key?'selected':''}>${label}</option>`).join('')}</select></div></div><div class="modal-actions"><button class="btn btn-ghost" type="button" data-action="close-modal">Отмена</button><button class="btn btn-primary" type="submit">${icon('check')} ${editing?'Сохранить':'Создать маршрут'}</button></div></form>`)}
function pointModal(routeId,pointId,pre={}){const r=routeById(routeId)||state.routes[0];if(!r){toast('Сначала создайте маршрут','error');routeModal();return}const p=r.points.find(x=>x.id===pointId),v=p||{name:pre.name||'',address:pre.address||'',lat:pre.lat??'',lng:pre.lng??'',when:'',cost:0,note:''};modal(p?'Редактировать точку':'Добавить точку','Укажите место, время посещения и расходы.',`<form data-form="point"><input type="hidden" name="id" value="${esc(p?.id||'')}"><div class="field"><label class="field-label">Маршрут *</label><select class="input" name="routeId" id="point-route">${state.routes.map(x=>`<option value="${esc(x.id)}" ${x.id===r.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="geocoder"><label>${icon('search',14)} Найти место по названию на карте</label><div class="geo-search-row"><input class="input" name="geoquery" id="geo-query" placeholder="Например, Красная площадь, Москва" autocomplete="off"><button type="button" class="btn btn-primary btn-sm" data-action="geocode">Найти</button></div><div class="geo-results" id="geo-results"><span class="field-hint">Поиск работает при подключении к интернету. Можно также ввести координаты вручную или нажать на карту.</span></div></div><div class="field"><label class="field-label">Название места *</label><input class="input" name="name" id="point-name" required maxlength="160" value="${esc(v.name)}" placeholder="Например, Кремль"></div><div class="field"><label class="field-label">Адрес / ориентир</label><input class="input" name="address" id="point-address" maxlength="300" value="${esc(v.address)}" placeholder="Улица или название района"></div><div class="form-grid"><div class="field"><label class="field-label">Дата и время</label><input class="input" type="datetime-local" name="when" value="${esc(v.when)}"></div><div class="field"><label class="field-label">Стоимость (${esc(state.profile.currency==='EUR'?'€':state.profile.currency==='USD'?'$':'₽')})</label><input class="input" type="number" min="0" max="1000000000" step="0.01" name="cost" value="${esc(v.cost)}"></div><div class="field"><label class="field-label">Широта *</label><input class="input" id="point-lat" type="number" step="any" min="-90" max="90" name="lat" required placeholder="55.7558" value="${esc(v.lat)}"></div><div class="field"><label class="field-label">Долгота *</label><input class="input" id="point-lng" type="number" step="any" min="-180" max="180" name="lng" required placeholder="37.6173" value="${esc(v.lng)}"></div><div class="field span-2"><label class="field-label">Заметка к точке</label><textarea class="textarea" name="note" rows="3" placeholder="Билеты, советы, планы...">${esc(v.note)}</textarea></div></div><div class="modal-actions"><button class="btn btn-ghost" type="button" data-action="close-modal">Отмена</button><button class="btn btn-primary" type="submit">${icon('check')} ${p?'Сохранить':'Добавить точку'}</button></div></form>`)}
function noteModal(id,routeId){const n=state.notes.find(x=>x.id===id);const v=n||{title:'',body:'',routeId:routeId||''};modal(n?'Изменить заметку':'Новая заметка','Запишите любую полезную информацию.',`<form data-form="note"><input type="hidden" name="id" value="${esc(n?.id||'')}"><div class="field"><label class="field-label">Заголовок *</label><input class="input" name="title" required maxlength="160" value="${esc(v.title)}" placeholder="Например, Список вещей"></div><div class="field"><label class="field-label">Для какого маршрута</label><select class="input" name="routeId"><option value="">Личная заметка (без маршрута)</option>${state.routes.map(r=>`<option value="${esc(r.id)}" ${v.routeId===r.id?'selected':''}>${esc(r.title)}</option>`).join('')}</select></div><div class="field"><label class="field-label">Текст заметки</label><textarea class="textarea" name="body" rows="7" placeholder="Ваша идея или напоминание...">${esc(v.body)}</textarea></div><div class="modal-actions"><button class="btn btn-ghost" type="button" data-action="close-modal">Отмена</button><button class="btn btn-primary" type="submit">${icon('check')} Сохранить</button></div></form>`)}

function runAction(el){const action=el.dataset.action;if(!action)return;const routeId=el.dataset.routeId||activeRouteId();const pointId=el.dataset.pointId;const noteId=el.dataset.noteId;const r=routeById(routeId);
  switch(action){
    case 'add-route':routeModal();break;
    case 'edit-route':routeModal(routeId);break;
    case 'delete-route':if(r&&confirm(`Удалить маршрут «${r.title}» и все его точки?`)){state.routes=state.routes.filter(x=>x.id!==r.id);state.notes=state.notes.map(n=>n.routeId===r.id?{...n,routeId:''}:n);save();navigate('routes');toast('Маршрут удалён')}break;
    case 'duplicate-route':if(r){const copy=JSON.parse(JSON.stringify(r));copy.id=makeId();copy.title+=' (копия)';copy.points=copy.points.map(p=>({...p,id:makeId()}));state.routes.unshift(copy);save();navigate('route',copy.id);toast('Копия маршрута создана')}break;
    case 'add-point':pointModal(routeId);break;
    case 'edit-point':pointModal(routeId,pointId);break;
    case 'delete-point':if(r){const p=r.points.find(x=>x.id===pointId);if(p&&confirm(`Удалить точку «${p.name}»?`)){r.points=r.points.filter(x=>x.id!==pointId);save();render();toast('Точка удалена')}}break;
    case 'move-point':if(r){const i=r.points.findIndex(x=>x.id===pointId),j=i+Number(el.dataset.direction);if(i>=0&&j>=0&&j<r.points.length){[r.points[i],r.points[j]]=[r.points[j],r.points[i]];save();render()}}break;
    case 'add-note':noteModal(null,routeId);break;
    case 'edit-note':noteModal(noteId);break;
    case 'delete-note':{const n=state.notes.find(x=>x.id===noteId);if(n&&confirm(`Удалить заметку «${n.title}»?`)){state.notes=state.notes.filter(x=>x.id!==noteId);save();render();toast('Заметка удалена')}}break;
    case 'close-modal':closeModal();break;
    case 'geocode':geocodeInModal();break;
    case 'map-mode':toggleMapPick();break;
    case 'map-reset':fitMapPoints();break;
    case 'map-retry':initMap(currentView(),activeRouteId());break;
    case 'map-source':map?.switchSource();break;
    case 'export':exportData();break;
    case 'import':document.getElementById('import-file').click();break;
    case 'reset-demo':if(confirm('Заменить ВСЕ ваши маршруты, заметки и профиль демонстрационными данными? Сохранённые данные будут потеряны!')){state=sampleData();save();ui={search:'',notesSearch:'',pointsSearch:'',pointsRouteId:'all',notesRouteId:'all',mapPicking:false};closeModal();navigate('routes');render();toast('Демонстрационные данные восстановлены')}break;
  }
}
function formSubmit(form){const d=new FormData(form);const type=form.dataset.form;
  if(type==='route'){
    const old=routeById(d.get('id'));const startDate=String(d.get('startDate')||''),endDate=String(d.get('endDate')||'');if(startDate&&endDate&&endDate<startDate){toast('Конец поездки не может быть раньше начала','error');return}
    const data={title:String(d.get('title')||'').trim(),city:String(d.get('city')||'').trim(),country:String(d.get('country')||'').trim(),startDate,endDate,description:String(d.get('description')||'').trim(),cover:covers.includes(d.get('cover'))?d.get('cover'):'city'};if(!data.title||!data.city){toast('Укажите название маршрута и город','error');return}if(old){Object.assign(old,data)}else{const n={id:makeId(),...data,points:[],createdAt:dateToday()};state.routes.unshift(n);form._newRoute=n.id}save();closeModal();navigate('route',form._newRoute||old.id);render();toast(old?'Маршрут обновлён':'Маршрут создан');return;
  }
  if(type==='point'){
    const target=routeById(d.get('routeId'));if(!target){toast('Укажите маршрут для точки','error');return}const lat=Number(d.get('lat')),lng=Number(d.get('lng'));if(!Number.isFinite(lat)||!Number.isFinite(lng)||lat<-90||lat>90||lng<-180||lng>180){toast('Проверьте координаты точки','error');return}
    const data={name:String(d.get('name')||'').trim(),address:String(d.get('address')||'').trim(),lat,lng,when:String(d.get('when')||''),cost:Math.max(0,Number(d.get('cost'))||0),note:String(d.get('note')||'').trim()};if(!data.name){toast('Введите название места','error');return}const id=d.get('id');let oldRoute=state.routes.find(r=>r.points.some(p=>p.id===id));let p=oldRoute?.points.find(p=>p.id===id);if(p){Object.assign(p,data);if(oldRoute.id!==target.id){oldRoute.points=oldRoute.points.filter(x=>x.id!==id);target.points.push(p)}}else{target.points.push({...data,id:makeId()})}
    ui.mapPicking=false;save();closeModal();render();toast(p?'Точка обновлена':'Точка добавлена на маршрут');return;
  }
  if(type==='note'){
    const old=state.notes.find(n=>n.id===d.get('id'));const data={title:String(d.get('title')||'').trim(),body:String(d.get('body')||'').trim(),routeId:String(d.get('routeId')||''),updatedAt:dateToday()};if(!data.title){toast('Введите заголовок заметки','error');return}if(old)Object.assign(old,data);else state.notes.unshift({...data,id:makeId()});save();closeModal();render();toast('Заметка сохранена');return;
  }
  if(type==='profile'){
    state.profile={name:String(d.get('name')||'').trim()||'Путешественник',city:String(d.get('city')||'').trim(),style:String(d.get('style')||'').trim(),currency:['RUB','EUR','USD'].includes(d.get('currency'))?d.get('currency'):'RUB'};save();render();toast('Профиль сохранён');return;
  }
  if(type==='map-search'){searchMapPlace(String(d.get('query')||'').trim());return;}
}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'Тропа'},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`tropa-backup-${dateToday()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Резервная копия скачана')}
async function importData(file){if(!file)return;try{const data=normalizeData(JSON.parse(await file.text()));if(!confirm('Заменить все текущие данные содержимым файла?'))return;state=data;save();ui.pointsRouteId='all';ui.notesRouteId='all';ui.search='';closeModal();navigate('routes');render();toast('Данные успешно импортированы')}catch(err){toast('Ошибка импорта: '+err.message,'error')}finally{document.getElementById('import-file').value=''}}

  const nav=e.target.closest('[data-nav]');if(nav){const section=nav.dataset.nav;const last=state.routes[0]?.id;navigate(section==='route'&&last?'route':section,section==='route'?last:null);return}
  const open=e.target.closest('[data-open-route]');if(open){navigate('route',open.dataset.openRoute);return}
  const action=e.target.closest('[data-action]');if(action){runAction(action);return}
  const geo=e.target.closest('[data-geo-pick]');if(geo){const p=ui.geoResults?.[Number(geo.dataset.geoPick)];if(p){for(const [id,value] of [['point-name',p.name],['point-address',p.address],['point-lat',p.lat],['point-lng',p.lng]]){const input=document.getElementById(id);if(input)input.value=value;}document.getElementById('geo-results').innerHTML='<small class="field-hint">✓ Место выбрано. При необходимости укажите время и стоимость.</small>';toast('Координаты подставлены')}return}
  const found=e.target.closest('[data-map-result]');if(found){const p=ui.mapSearchResults?.[Number(found.dataset.mapResult)];if(!p)return;document.getElementById('map-results')?.classList.remove('show');if(map){map.setView([p.lat,p.lng],15);map.showSearchMarker(p);}const selected=currentView()==='route'?activeRouteId():ui.pointsRouteId!=='all'?ui.pointsRouteId:state.routes[0]?.id;pointModal(selected,null,p);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.modal-backdrop'))closeModal();else if(ui.mapPicking){ui.mapPicking=false;const tip=document.getElementById('map-tip');if(tip)tip.hidden=true;}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open-route]')){e.preventDefault();navigate('route',e.target.dataset.openRoute)}});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();formSubmit(form)});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='route-search'){ui.search=e.target.value;document.getElementById('route-grid').innerHTML=routeCards()}else if(id==='point-search'){ui.pointsSearch=e.target.value;document.getElementById('points-table').innerHTML=pointsRows();drawMapMarkers('points')}else if(id==='notes-search'){ui.notesSearch=e.target.value;document.getElementById('notes-grid').innerHTML=noteCards()}});
document.addEventListener('change',e=>{if(e.target.id==='points-filter'){ui.pointsRouteId=e.target.value;render()}if(e.target.id==='notes-filter'){ui.notesRouteId=e.target.value;document.getElementById('notes-grid').innerHTML=noteCards()}});
document.getElementById('import-file').addEventListener('change',e=>importData(e.target.files?.[0]));
window.addEventListener('hashchange',render);
if(!location.hash||!['routes','route','points','notes','profile'].includes(currentView())){location.hash='#/routes'}
render();

  </script>
</body>
</html>
